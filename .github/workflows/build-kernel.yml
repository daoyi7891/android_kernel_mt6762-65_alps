# 自动编译 MediaTek MT6762/MT6765 (ALPS 4.19.191) 内核
#
# 触发方式：只有手动（Actions -> Build kernel -> Run workflow）
#   - 可选 defconfig / 调试符号 / 是否编 dtbs
#   - 填了 release_tag 就顺便发一个 Release，并在下载后附上 zip
#
# 产物：Actions -> Artifacts，下载得到的 zip 就是可直接刷入的包
#   - 仓库里有 AnyKernel3/ 时：刷机包内容原样上传，GitHub 打的 zip 即 AK3 包
#   - 否则退回裸内核包：Image.gz / System.map / config / dtb / BUILD_INFO.txt

name: Build kernel

on:
  push:
    branches:
      - 4.19.191-U1Pro
  workflow_dispatch:
    inputs:
      defconfig:
        description: "内核配置（arch/arm64/configs 下的文件名）"
        type: choice
        required: true
        default: u1pro_defconfig
        options:
          - u1pro_defconfig
      debug_info:
        description: "保留调试符号 (CONFIG_DEBUG_INFO)，编译更慢、体积更大"
        type: boolean
        default: false
      build_dtbs:
        description: "同时尝试编译设备树 (dtbs)"
        type: boolean
        default: true
      bakasu:
        description: "启用 BakaSU"
        type: boolean
        default: true
      release_tag:
        description: "可选：填了就把产物发到这个 tag 的 Release"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CC: aarch64-linux-gnu-gcc-10
  CROSS_CC: aarch64-linux-gnu-gcc-10
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  KBUILD_BUILD_USER: github
  KBUILD_BUILD_HOST: actions

jobs:
  build:
    name: Compile kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve build parameters
        id: params
        run: |
          set -euo pipefail

          defconfig="${{ inputs.defconfig }}"
          [ -n "$defconfig" ] || defconfig="k65v1_64_bsp_defconfig"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            debug_info="${{ inputs.debug_info }}"
            build_dtbs="${{ inputs.build_dtbs }}"
          else
            debug_info="false"
            build_dtbs="true"
          fi
          [ -n "$debug_info" ] || debug_info="false"
          [ -n "$build_dtbs" ] || build_dtbs="true"

          bakasu="${{ inputs.bakasu }}"
          [ -n "$bakasu" ] || bakasu="true"

          # BakaSU 开关决定产物名要不要带标识
          variant=""
          if [ "$bakasu" = "true" ]; then
            variant="BakaSU"
          fi

          short_sha="${GITHUB_SHA:0:7}"
          kernel_name="kernel-${defconfig%_defconfig}-$(date -u +%Y%m%d)-${short_sha}"
          [ -n "$variant" ] && kernel_name="${variant}-${kernel_name}"

          echo "defconfig=$defconfig" >> "$GITHUB_OUTPUT"
          echo "debug_info=$debug_info" >> "$GITHUB_OUTPUT"
          echo "build_dtbs=$build_dtbs" >> "$GITHUB_OUTPUT"
          echo "bakasu=$bakasu" >> "$GITHUB_OUTPUT"
          echo "kernel_name=$kernel_name" >> "$GITHUB_OUTPUT"
          echo "variant=$variant" >> "$GITHUB_OUTPUT"

          {
            echo "DEFCONFIG=$defconfig"
            echo "DEBUG_INFO=$debug_info"
            echo "BUILD_DTBS=$build_dtbs"
            echo "BAKASU=$bakasu"
            echo "KERNEL_NAME=$kernel_name"
          } >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev xz-utils cpio \
            zip unzip ccache gcc-10-aarch64-linux-gnu binutils-aarch64-linux-gnu
          # 有些脚本会直接调用 $(CROSS_COMPILE)gcc（不带版本后缀）
          command -v aarch64-linux-gnu-gcc >/dev/null \
            || sudo ln -sf "$(command -v aarch64-linux-gnu-gcc-10)" /usr/local/bin/aarch64-linux-gnu-gcc

          echo "--- toolchain ---"
          ccache --max-size=2G
          aarch64-linux-gnu-gcc --version | head -1
          make --version | head -1
          ccache --version | head -1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ steps.params.outputs.defconfig }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ steps.params.outputs.defconfig }}-
            ccache-

      - name: Patch vendor tree for GCC
        run: |
          # 内核把 inline 展开成 always_inline，而下面几处声明没有函数体，
          # GCC 调用时会报 "function body not available"。去掉多余的 inline 即可。
          sed -i 's/^inline void uclamp_se_set(/void uclamp_se_set(/' kernel/sched/sched.h
          sed -i 's/^inline void ksm_flock(/void ksm_flock(/' include/linux/keyslot-manager.h
          sed -i 's/^inline void blk_crypto_flock(/void blk_crypto_flock(/' include/linux/blk-crypto.h
          sed -i 's/^inline u32 spi_read_reg(/u32 spi_read_reg(/' drivers/misc/mediatek/cmdq/bridge/cmdq-bdg.h
          sed -i 's/^inline s32 spi_write_reg(/s32 spi_write_reg(/' drivers/misc/mediatek/cmdq/bridge/cmdq-bdg.h

          # MTK 各子目录在 Makefile 里写死了 -Werror，新编译器的新告警会直接中断编译。
          # 只去掉构建脚本里的 -Werror，不改任何代码逻辑。
          grep -rlZ -I -- "-Werror" drivers sound | tr '\0' '\n' \
            | grep -E '(Makefile|Kbuild\.mk|Kbuild)$' \
            | xargs -r sed -i 's/ *-Werror[^[:space:]]*//g'

          # 这个树里 mt6765 的 dts 没登记到 dtb-y，补一行让 make dtbs 能产出它
          makefile_dts=arch/arm64/boot/dts/mediatek/Makefile
          grep -q 'mt6765\.dtb' "$makefile_dts" \
            || sed -i '1a dtb-$(CONFIG_ARCH_MEDIATEK) += mt6765.dtb' "$makefile_dts"

          # 兜底：其余目录如果也有 -Werror，统一不再把告警当错误
          echo "KCFLAGS_EXTRA=-Wno-error" >> "$GITHUB_ENV"

      - name: Apply Safe SUSFS patches (4.19)
        if: env.BAKASU == 'true'
        run: |
          REPO="https://gitlab.com""/simonpunk/susfs4ksu.git"
          git clone --depth=1 -b kernel-4.19 "$REPO" /tmp/susfs4ksu || git clone --depth=1 "$REPO" /tmp/susfs4ksu
          cp -rf /tmp/susfs4ksu/kernel_patches/fs/* fs/
          cp -rf /tmp/susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 --fuzz=3 < /tmp/susfs4ksu/kernel_patches/*.patch || true
          python3 -c '
          import re

          rej = open("include/linux/sched.h.rej").read()
          adds = "\n".join(line[1:] for line in rej.splitlines() if line.startswith("+") and not line.startswith("+++"))
          sched = open("include/linux/sched.h").read()
          aligned_adds = "\n\t/* SUSFS aligned fields */\n" + adds + "\n"
          sched_new, n = re.subn(r"(struct task_struct\s*\{[\s\S]*?)(\n\};)", r"\1" + aligned_adds + r"\2", sched, count=1)
          assert n == 1, "Failed to locate task_struct"
          open("include/linux/sched.h", "w").write(sched_new)

          fdinfo = open("fs/notify/fdinfo.c").read()
          fdinfo = fdinfo.replace("inotify_mark_user_mask(mark)", "(mark->mask & IN_ALL_EVENTS)")
          fdinfo = fdinfo.replace("u32 mask = mark->mask & IN_ALL_EVENTS;", "; u32 mask = mark->mask & IN_ALL_EVENTS;")
          open("fs/notify/fdinfo.c", "w").write(fdinfo)

          sys_c = open("kernel/sys.c").read()
          if "ksu_handle_setresuid" not in sys_c:
              hook_decl = "#ifdef CONFIG_KSU_SUSFS\nextern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n#endif\n"
              hook_call = "\n#ifdef CONFIG_KSU_SUSFS\n\tksu_handle_setresuid(ruid, euid, suid);\n#endif\n"
              sys_c, m = re.subn(r"(SYSCALL_DEFINE3\(setresuid,\s*uid_t,\s*ruid,\s*uid_t,\s*euid,\s*uid_t,\s*suid\)\s*\{)", hook_decl + r"\1" + hook_call, sys_c, count=1)
              open("kernel/sys.c", "w").write(sys_c)

          rw_c = open("fs/read_write.c").read()
          if "ksu_handle_sys_read" not in rw_c:
              r_decl = "#ifdef CONFIG_KSU_SUSFS\nextern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);\n#endif\n"
              r_call = "\n#ifdef CONFIG_KSU_SUSFS\n\tksu_handle_sys_read(fd, &buf, &count);\n#endif\n"
              rw_c, r = re.subn(r"(ssize_t\s+ksys_read\s*\(\s*unsigned\s+int\s+fd\s*,\s*char\s+__user\s*\*\s*buf\s*,\s*size_t\s+count\s*\)\s*\{)", r_decl + r"\1" + r_call, rw_c, count=1)
              if r == 0:
                  rw_c, r = re.subn(r"(SYSCALL_DEFINE3\(read,\s*unsigned\s+int,\s*fd,\s*char\s+__user\s*\*,\s*buf,\s*size_t,\s*count\)\s*\{)", r_decl + r"\1" + r_call, rw_c, count=1)
              open("fs/read_write.c", "w").write(rw_c)

          defs_h = open("include/linux/susfs_def.h").read()
          if "SUSFS_MAGIC" not in defs_h:
              defs_h += "\n#define SUSFS_MAGIC 0x55555555\n"
              open("include/linux/susfs_def.h", "w").write(defs_h)
          '
          sed -i 's/\$(error /\$(warning /g' drivers/kernelsu/tools/inline_hook_check.mk || true

      - name: Configure kernel
        run: |
          make -j"$(nproc)" ARCH=arm64 O=out "$DEFCONFIG"

          if [ "$BAKASU" = "true" ]; then
            echo "==> 启用 BakaSU + 4.19 安全版 SUSFS"
            scripts/config --file out/.config \
              -e KSU -d KSU_MANUAL_HOOK -d KSU_TRACEPOINT_HOOK -e KSU_SUSFS -e KALLSYMS_ALL \
              -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
              -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_SPOOF_UNAME \
              -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_SUS_SU \
              -d KSU_SUSFS_SUS_MAP -d KSU_SUSFS_TRY_UMOUNT -d KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          else
            echo "==> 未启用 BakaSU"
            scripts/config --file out/.config -d KSU -d KSU_MANUAL_HOOK -d KSU_TRACEPOINT_HOOK -d KSU_SUSFS
          fi
          make -j"$(nproc)" ARCH=arm64 O=out olddefconfig

      - name: Build kernel
        run: |
          export KBUILD_BUILD_TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          make -j"$(nproc)" ARCH=arm64 O=out \
            CC="ccache $CROSS_CC" \
            KCFLAGS="$KCFLAGS_EXTRA" \
            Image.gz

      - name: Build device trees (best effort)
        if: steps.params.outputs.build_dtbs == 'true'
        run: |
          make -j"$(nproc)" ARCH=arm64 O=out CC="ccache $CROSS_CC" KCFLAGS="$KCFLAGS_EXTRA" dtbs \
            || echo "::warning::make dtbs 失败，继续打包已生成的内容"

      - name: Package artifacts
        id: package
        run: |
          set -euo pipefail
          name="$KERNEL_NAME"
          short_sha="${GITHUB_SHA:0:7}"
          version="$(make -s ARCH=arm64 O=out kernelrelease)"
          display="$name ($version)"
          kver="${version%%.*}.$(echo "${version#*.}" | cut -d. -f1)"

          write_info() {
            {
              echo "kernel    : $version"
              echo "defconfig : $DEFCONFIG"
              echo "commit    : $GITHUB_SHA"
              echo "ref       : $GITHUB_REF"
              echo "compiler  : $("$CROSS_CC" --version | head -1)"
              echo "built at  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              echo "builder   : GitHub Actions ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            } > "$1"
          }

          # 目录内容 = 刷机包内容；Artifacts 直接传这个目录，
          # GitHub 打包出来的 zip 就是可刷的 AK3 包，不用再套一层。
          root="dist/$name"
          rm -rf "$root"
          mkdir -p "$root"

          if [ -f AnyKernel3/anykernel.sh ]; then
            kind="AnyKernel3"
            cp -a AnyKernel3/. "$root/"
            cp out/arch/arm64/boot/Image.gz "$root/Image.gz"
            # 只校验内核版本、不校验机型
            sed -i "s|^kernel.string=.*|kernel.string=$display|" "$root/anykernel.sh"
            sed -i "s|^EXPECTED_KVER=.*|EXPECTED_KVER=$kver;|" "$root/anykernel.sh"

            mkdir -p "$root/dtb"
            for f in u1pro.dtb u1pro-overlay.dtbo mt6765.dtb; do
              [ -f "out/arch/arm64/boot/dts/mediatek/$f" ] && cp "out/arch/arm64/boot/dts/mediatek/$f" "$root/dtb/"
            done
          else
            kind="raw"
            cp out/arch/arm64/boot/Image.gz "$root/Image.gz"
            cp out/System.map               "$root/System.map"
            cp out/.config                  "$root/config"
            mkdir -p "$root/dtb"
            for f in u1pro.dtb u1pro-overlay.dtbo mt6765.dtb; do
              [ -f "out/arch/arm64/boot/dts/mediatek/$f" ] && cp "out/arch/arm64/boot/dts/mediatek/$f" "$root/dtb/"
            done
          fi

          write_info "$root/BUILD_INFO.txt"

          # 给 tag 发 Release 用（发布资产不会二次打包）
          ( cd "$root" && zip -qr -9 "../$name.zip" . )
          echo "zip=dist/$name.zip" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

          {
            echo "### 编译完成 :white_check_mark:"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 配置 | \`$DEFCONFIG\` |"
            echo "| 内核版本 | \`$version\` |"
            echo "| 提交 | \`$short_sha\` |"
            echo "| 类型 | $kind |"
            echo "| 产物 | \`$name.zip\` |"
            echo "| 调试符号 | $DEBUG_INFO |"
            echo ""
            echo "Artifacts 里下载回来的 \`$name.zip\` 可以直接刷，不需要再解压或重打包。"
            echo "包大小：$(du -h "dist/$name.zip" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.params.outputs.kernel_name }}
          path: dist/${{ steps.params.outputs.kernel_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: ${{ steps.package.outputs.zip }}
          generate_release_notes: true
